[package]
name = "adead-bib"
version = "8.0.0"
edition = "2021"

[dependencies]
nom = "7.1"
object = { version = "0.36", features = ["write_core"] }  # Para generar PE/ELF
goblin = "0.7"   # Para parsing de binarios (opcional)
pelite = "0.10"  # Para generar PE válidos

# Vulkan - Para exprimir GPU con fuerza
ash = "0.38"                    # Vulkan bindings (bajo nivel, máximo control)
gpu-allocator = "0.27"          # Allocator de memoria GPU
regex = "1.12.3"

# Real Compiler - Parser y análisis avanzado
tree-sitter = "0.22"
tree-sitter-c = "0.21"
tree-sitter-cpp = "0.22"
logos = "0.14"
codespan-reporting = "0.11"
cranelift-codegen = "0.109"
cranelift-frontend = "0.109"
cranelift-module = "0.109"
cranelift-object = "0.109"
gimli = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
rayon = "1"
dashmap = "6"
indexmap = "2"
string-interner = "0.17"
pyo3 = "0.22"

# ADead-BIB es 100% Rust - No requiere dependencias de C++

