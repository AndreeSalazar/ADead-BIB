[workspace]
members = [
    "00_bin/adeb-cli",
    "01_compiler/01_frontend",
    "01_compiler/02_middle",
    "01_compiler/03_backend_cpu",
    "01_compiler/04_backend_gpu",
    "02_core/adeb-core",
    "02_core/adeb-platform",
    "02_core/adeb-stdlib",
    "02_core/adeb-bridge",
    "02_core/adeb-bg",
]
resolver = "2"

[workspace.package]
version = "7.0.0"
edition = "2021"
authors = ["ADead-BIB Team"]
license = "Techne (τέχνη)"
repository = "https://github.com/AndreeSalazar/ADead-BIB"
rust-version = "1.70"

[workspace.dependencies]
# Core dependencies
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.4", features = ["derive"] }
colored = "2.0"
indicatif = "0.17"

# Text processing
regex = "1.10"

# Parallelism
rayon = "1.8"

# GPU (features enabled in individual crates)
wgpu = { version = "0.19" }
ash = { version = "0.37" }

# Internal crates
adeb-core = { path = "02_core/adeb-core" }
adeb-frontend-c = { path = "01_compiler/01_frontend" }
adeb-middle = { path = "01_compiler/02_middle" }
adeb-backend-x64 = { path = "01_compiler/03_backend_cpu" }
adeb-backend-gpu = { path = "01_compiler/04_backend_gpu" }
adeb-platform = { path = "02_core/adeb-platform" }
adeb-stdlib = { path = "02_core/adeb-stdlib" }
adeb-bridge = { path = "02_core/adeb-bridge" }
adeb-bg = { path = "02_core/adeb-bg" }
